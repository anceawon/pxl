<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#73B5FE' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #00000022; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #ffffff22; }
    </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Auth 모달 -->
    <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-4 relative">
            <button type="button" onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <button type="button" onclick="handleGoogleLogin()" class="w-full py-2.5 px-4 rounded-xl border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 font-semibold text-xs flex items-center justify-center gap-2.5 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Google 계정으로 계속하기</span>
            </button>

            <div class="flex items-center gap-2 my-1">
                <div class="flex-1 h-[1px] bg-gray-200 dark:bg-gray-800"></div>
                <span class="text-[11px] text-gray-400">또는</span>
                <div class="flex-1 h-[1px] bg-gray-200 dark:bg-gray-800"></div>
            </div>

            <div class="flex border-b border-gray-200 dark:border-gray-800">
                <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-sm text-[#73B5FE] border-b-2 border-[#73B5FE]">로그인</button>
                <button type="button" id="tabSignupBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-sm text-gray-400 border-b-2 border-transparent">회원가입</button>
            </div>

            <!-- 로그인 -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="flex flex-col gap-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">이메일</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-1">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="비밀번호 입력" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <p id="loginErrorText" class="text-[11px] text-red-500 hidden"></p>
                <button type="submit" class="w-full py-3 mt-1 rounded-xl bg-[#73B5FE] text-white font-bold text-sm hover:opacity-90 transition">로그인</button>
            </form>

            <!-- 회원가입 -->
            <form id="signupForm" onsubmit="handleSignup(event)" class="hidden flex flex-col gap-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">이메일</label>
                    <input type="email" id="signupEmail" placeholder="example@email.com" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-1">비밀번호 (6자리 이상)</label>
                    <input type="password" id="signupPassword" placeholder="비밀번호 입력" required minlength="6" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-1">닉네임</label>
                    <input type="text" id="signupNickname" placeholder="닉네임 입력" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-2">프로필 색상</label>
                    <div class="flex justify-between items-center px-2">
                        <button type="button" onclick="selectColor('#E8472A', 'signup')" class="signup-color-opt w-7 h-7 rounded-full bg-[#E8472A] ring-2 ring-offset-2 ring-transparent" data-color="#E8472A"></button>
                        <button type="button" onclick="selectColor('#FFB400', 'signup')" class="signup-color-opt w-7 h-7 rounded-full bg-[#FFB400] ring-2 ring-offset-2 ring-transparent" data-color="#FFB400"></button>
                        <button type="button" onclick="selectColor('#FCDB00', 'signup')" class="signup-color-opt w-7 h-7 rounded-full bg-[#FCDB00] ring-2 ring-offset-2 ring-transparent" data-color="#FCDB00"></button>
                        <button type="button" onclick="selectColor('#829D56', 'signup')" class="signup-color-opt w-7 h-7 rounded-full bg-[#829D56] ring-2 ring-offset-2 ring-transparent" data-color="#829D56"></button>
                        <button type="button" onclick="selectColor('#73B5FE', 'signup')" class="signup-color-opt w-7 h-7 rounded-full bg-[#73B5FE] ring-2 ring-offset-2 ring-transparent" data-color="#73B5FE"></button>
                        <button type="button" onclick="selectColor('#934F9A', 'signup')" class="signup-color-opt w-7 h-7 rounded-full bg-[#934F9A] ring-2 ring-offset-2 ring-transparent" data-color="#934F9A"></button>
                    </div>
                </div>
                <p id="signupErrorText" class="text-[11px] text-red-500 hidden"></p>
                <button type="submit" class="w-full py-3 mt-1 rounded-xl bg-[#73B5FE] text-white font-bold text-sm hover:opacity-90 transition">회원가입 완료</button>
            </form>
        </div>
    </div>

    <!-- 내 프로필 관리 모달 -->
    <div id="userProfileModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-4 relative">
            <button type="button" onclick="closeProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <h2 class="text-base font-bold">내 프로필 설정 👤</h2>
            
            <form onsubmit="handleProfileUpdate(event)" class="flex flex-col gap-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1 text-gray-500">이메일 계정</label>
                    <input type="text" id="profileUserEmail" disabled class="w-full bg-gray-100 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-800 rounded-lg p-2.5 text-gray-400 cursor-not-allowed">
                </div>
                <div>
                    <label class="block font-semibold mb-1">닉네임 변경</label>
                    <input type="text" id="profileNicknameInput" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-2">프로필 색상 변경</label>
                    <div class="flex justify-between items-center px-2">
                        <button type="button" onclick="selectColor('#E8472A', 'profile')" class="profile-color-opt w-7 h-7 rounded-full bg-[#E8472A] ring-2 ring-offset-2 ring-transparent" data-color="#E8472A"></button>
                        <button type="button" onclick="selectColor('#FFB400', 'profile')" class="profile-color-opt w-7 h-7 rounded-full bg-[#FFB400] ring-2 ring-offset-2 ring-transparent" data-color="#FFB400"></button>
                        <button type="button" onclick="selectColor('#FCDB00', 'profile')" class="profile-color-opt w-7 h-7 rounded-full bg-[#FCDB00] ring-2 ring-offset-2 ring-transparent" data-color="#FCDB00"></button>
                        <button type="button" onclick="selectColor('#829D56', 'profile')" class="profile-color-opt w-7 h-7 rounded-full bg-[#829D56] ring-2 ring-offset-2 ring-transparent" data-color="#829D56"></button>
                        <button type="button" onclick="selectColor('#73B5FE', 'profile')" class="profile-color-opt w-7 h-7 rounded-full bg-[#73B5FE] ring-2 ring-offset-2 ring-transparent" data-color="#73B5FE"></button>
                        <button type="button" onclick="selectColor('#934F9A', 'profile')" class="profile-color-opt w-7 h-7 rounded-full bg-[#934F9A] ring-2 ring-offset-2 ring-transparent" data-color="#934F9A"></button>
                    </div>
                </div>
                <p id="profileErrorText" class="text-[11px] text-red-500 hidden"></p>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-[#73B5FE] text-white font-bold text-xs hover:opacity-90 transition mt-1">프로필 저장</button>
            </form>

            <div class="border-t border-gray-200 dark:border-gray-800 pt-3 flex flex-col gap-2">
                <button type="button" onclick="handleLogout()" class="w-full py-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                </button>
                <button type="button" onclick="handleDeleteAccount()" class="w-full py-2 rounded-xl bg-red-50 dark:bg-red-950/30 text-red-500 font-bold text-xs hover:bg-red-100 dark:hover:bg-red-900/50 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-user-xmark"></i> 회원탈퇴
                </button>
            </div>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between gap-2">
        <button onclick="goHome()" class="flex items-center gap-2 text-lg font-extrabold tracking-tight">
            <i class="fa-solid fa-cloud text-xl text-[#73B5FE]"></i>
            <span>PixelHub</span>
        </button>

        <div class="flex items-center bg-gray-100 dark:bg-gray-800 p-1 rounded-full text-xs font-semibold">
            <button id="tabVideoBtn" onclick="switchTab('video')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white transition">
                <i class="fa-solid fa-film text-[#73B5FE]"></i><span>동영상</span>
            </button>
            <button id="tabCommunityBtn" onclick="switchTab('community')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">
                <i class="fa-solid fa-comments"></i><span>커뮤니티</span>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>

            <button id="guestAuthBtn" onclick="openAuthModal()" class="px-3 py-1.5 rounded-full bg-[#73B5FE] text-white text-xs font-bold hover:opacity-90 transition">
                로그인 / 회원가입
            </button>

            <button id="userAuthBtn" onclick="openProfileModal()" class="hidden flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-xs font-semibold hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <div id="userAvatarDot" class="w-3.5 h-3.5 rounded-full bg-[#73B5FE]"></div>
                <span id="headerUserName">유저</span>
            </button>

            <button onclick="switchTab('admin')" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 transition">
                <i class="fa-solid fa-user-shield"></i>
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-5">
        <section id="filterSection" class="flex flex-col gap-3">
            <div class="flex gap-2">
                <input type="text" id="searchInput" oninput="renderMainView()" placeholder="검색어를 입력하세요..." class="flex-1 bg-gray-100 dark:bg-gray-800 text-xs sm:text-sm border border-gray-200 dark:border-gray-700 rounded-xl py-2.5 px-3.5 focus:outline-none">
                <button onclick="openPostModal()" class="bg-[#73B5FE] text-white px-4 py-2.5 rounded-xl font-bold text-xs hover:opacity-90 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i> <span>글 작성하기</span>
                </button>
            </div>
            
            <!-- 조 이름 바로 확인용 계산기/조회기 -->
            <div class="bg-gray-50 dark:bg-gray-900 p-3 rounded-xl border border-gray-200 dark:border-gray-800 flex flex-wrap items-center gap-2 text-xs">
                <span class="font-bold text-[#73B5FE]"><i class="fa-solid fa-users"></i> 조 이름 확인:</span>
                <select id="teamMember1" onchange="updateTeamNameDisplay()" class="bg-white dark:bg-gray-800 border rounded p-1">
                    <option value="잠뜰">잠뜰</option>
                    <option value="각별">각별</option>
                    <option value="공룡">공룡</option>
                    <option value="수현">수현</option>
                    <option value="라더">라더</option>
                    <option value="덕개">덕개</option>
                </select>
                <span>+</span>
                <select id="teamMember2" onchange="updateTeamNameDisplay()" class="bg-white dark:bg-gray-800 border rounded p-1">
                    <option value="각별">각별</option>
                    <option value="잠뜰">잠뜰</option>
                    <option value="공룡">공룡</option>
                    <option value="수현">수현</option>
                    <option value="라더">라더</option>
                    <option value="덕개">덕개</option>
                </select>
                <span>➔</span>
                <span id="teamNameResult" class="font-extrabold text-brand bg-brand/10 px-2.5 py-1 rounded-lg">이과조 / 연장자조</span>
            </div>
        </section>

        <section id="videoSection" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5"></section>
        <section id="communitySection" class="hidden flex flex-col gap-4"></section>
        <section id="adminSection" class="hidden flex flex-col gap-4">
            <h2 class="font-bold text-lg border-b pb-2">⚙️ 관리자 대시보드</h2>
            <div id="adminPostList" class="flex flex-col gap-2"></div>
        </section>
    </main>

    <!-- 업로드 모달 -->
    <div id="postModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-4">
            <h2 class="text-base font-bold">게시물 작성</h2>
            <form onsubmit="handlePostSubmit(event)" class="flex flex-col gap-3 text-xs">
                <input type="text" id="postTitleInput" placeholder="제목" required class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2.5 rounded-lg">
                <textarea id="postContentInput" placeholder="설명 또는 글 내용을 입력하세요..." class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2.5 rounded-lg rows-3"></textarea>
                
                <div class="flex flex-col gap-1">
                    <label class="font-semibold text-gray-700 dark:text-gray-300">사진 또는 동영상 첨부 (또는 URL 링크)</label>
                    <input type="file" id="postFileInput" accept="image/*,video/*" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 rounded-lg text-xs">
                    <input type="url" id="postUrlInput" placeholder="또는 미디어 URL 링크 직접 입력" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 rounded-lg text-xs mt-1">
                </div>

                <div id="uploadProgressContainer" class="hidden flex flex-col gap-1">
                    <div class="flex justify-between text-[11px] text-gray-500 font-bold">
                        <span id="uploadStatusText">업로드 처리 중...</span>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-800 font-medium">취소</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 rounded-lg bg-[#73B5FE] text-white font-bold">게시하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9woOD28gKukh_aELmpLex3JvbBi0lreQ",
            authDomain: "pxll-dd7f7.firebaseapp.com",
            databaseURL: "https://pxll-dd7f7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pxll-dd7f7",
            storageBucket: "pxll-dd7f7.firebasestorage.app",
            messagingSenderId: "363694383096",
            appId: "1:363694383096:web:e3e7f9473e0f84ccfac00d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 📌 이미지 표 기반 조 이름 데이터베이스
        const TEAM_NAMES = {
            "잠뜰_각별": "이과조 / 연장자조",
            "잠뜰_공룡": "주작조",
            "잠뜰_수현": "잠컴조 / 집사조",
            "잠뜰_라더": "바다조",
            "잠뜰_덕개": "저녁노을조",
            "각별_공룡": "후드조 / 공각",
            "각별_수현": "원형조",
            "각별_라더": "괴짜조",
            "각별_덕개": "각개전투조 / 맏막조",
            "공룡_수현": "오로라조",
            "공룡_라더": "이빨조",
            "공룡_덕개": "부산조",
            "수현_라더": "황혼조",
            "수현_덕개": "인덕션조 / 무해조",
            "라더_덕개": "라떡조"
        };

        function getTeamName(m1, m2) {
            if (m1 === m2) return "동일한 멤버입니다";
            const key1 = `${m1}_${m2}`;
            const key2 = `${m2}_${m1}`;
            return TEAM_NAMES[key1] || TEAM_NAMES[key2] || "알 수 없는 조";
        }

        function updateTeamNameDisplay() {
            const m1 = document.getElementById('teamMember1').value;
            const m2 = document.getElementById('teamMember2').value;
            document.getElementById('teamNameResult').innerText = getTeamName(m1, m2);
        }

        const BANNED_NICKNAMES = [
            "라더", "덕개", "각별", "공룡", "잠뜰", "수현",
            "sleepground", "rather", "duckgae", "rockggun", "hsrd", "heptagram", "ehdgh141", "dino", "suhyen"
        ];

        let currentUserData = null;
        let currentTab = 'video';
        let selectedSignupColor = '#73B5FE';
        let selectedProfileColor = '#73B5FE';

        let globalVideos = [];
        let globalPosts = [];

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            listenAuthState();
            listenRealtimeData();
            selectColor('#73B5FE', 'signup');
            selectColor('#73B5FE', 'profile');
            updateTeamNameDisplay();
        });

        function initTheme() {
            const savedTheme = localStorage.getItem('pixel_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-yellow-400';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('pixel_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-yellow-400' : 'fa-solid fa-moon';
        }

        function listenAuthState() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const snap = await db.ref('users/' + user.uid).once('value');
                    let val = snap.val();

                    if (!val) {
                        const name = user.displayName || user.email.split('@')[0];
                        val = { name: name, color: '#73B5FE', email: user.email };
                        await db.ref('users/' + user.uid).set(val);
                    }

                    currentUserData = {
                        uid: user.uid,
                        email: user.email,
                        name: val.name,
                        color: val.color || '#73B5FE'
                    };
                    document.getElementById('guestAuthBtn').classList.add('hidden');
                    document.getElementById('userAuthBtn').classList.remove('hidden');
                    document.getElementById('headerUserName').innerText = currentUserData.name;
                    document.getElementById('userAvatarDot').style.backgroundColor = currentUserData.color;
                } else {
                    currentUserData = null;
                    document.getElementById('guestAuthBtn').classList.remove('hidden');
                    document.getElementById('userAuthBtn').classList.add('hidden');
                }
            });
        }

        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
            switchAuthTab('login');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }
