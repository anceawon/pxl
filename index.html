<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#73B5FE' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (App, Auth, Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #00000022; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #ffffff22; }
    </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Auth 모달 (로그인 / 회원가입) -->
    <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-4 relative">
            <button type="button" onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- Google 로그인 버튼 -->
            <button type="button" onclick="handleGoogleLogin()" class="w-full py-2.5 px-4 rounded-xl border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 font-semibold text-xs flex items-center justify-center gap-2.5 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Google 계정으로 계속하기</span>
            </button>

            <div class="flex items-center gap-2 my-1">
                <div class="flex-1 h-[1px] bg-gray-200 dark:bg-gray-800"></div>
                <span class="text-[11px] text-gray-400">또는</span>
                <div class="flex-1 h-[1px] bg-gray-200 dark:bg-gray-800"></div>
            </div>

            <!-- 탭 (로그인 / 회원가입) -->
            <div class="flex border-b border-gray-200 dark:border-gray-800">
                <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-sm text-[#73B5FE] border-b-2 border-[#73B5FE]">로그인</button>
                <button type="button" id="tabSignupBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-sm text-gray-400 border-b-2 border-transparent">회원가입</button>
            </div>

            <!-- 로그인 폼 -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="flex flex-col gap-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">이메일</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-1">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="비밀번호 입력" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <p id="loginErrorText" class="text-[11px] text-red-500 hidden"></p>
                <button type="submit" class="w-full py-3 mt-1 rounded-xl bg-[#73B5FE] text-white font-bold text-sm hover:opacity-90 transition">로그인</button>
            </form>

            <!-- 회원가입 폼 -->
            <form id="signupForm" onsubmit="handleSignup(event)" class="hidden flex flex-col gap-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">이메일</label>
                    <input type="email" id="signupEmail" placeholder="example@email.com" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-1">비밀번호 (6자리 이상)</label>
                    <input type="password" id="signupPassword" placeholder="비밀번호 입력" required minlength="6" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-1">닉네임</label>
                    <input type="text" id="signupNickname" placeholder="닉네임 입력" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block font-semibold mb-2">프로필 색상</label>
                    <div class="flex justify-between items-center px-2">
                        <button type="button" onclick="selectColor('#E8472A')" class="color-opt w-7 h-7 rounded-full bg-[#E8472A] ring-2 ring-offset-2 ring-transparent" data-color="#E8472A"></button>
                        <button type="button" onclick="selectColor('#FFB400')" class="color-opt w-7 h-7 rounded-full bg-[#FFB400] ring-2 ring-offset-2 ring-transparent" data-color="#FFB400"></button>
                        <button type="button" onclick="selectColor('#FCDB00')" class="color-opt w-7 h-7 rounded-full bg-[#FCDB00] ring-2 ring-offset-2 ring-transparent" data-color="#FCDB00"></button>
                        <button type="button" onclick="selectColor('#829D56')" class="color-opt w-7 h-7 rounded-full bg-[#829D56] ring-2 ring-offset-2 ring-transparent" data-color="#829D56"></button>
                        <button type="button" onclick="selectColor('#73B5FE')" class="color-opt w-7 h-7 rounded-full bg-[#73B5FE] ring-2 ring-offset-2 ring-transparent" data-color="#73B5FE"></button>
                        <button type="button" onclick="selectColor('#934F9A')" class="color-opt w-7 h-7 rounded-full bg-[#934F9A] ring-2 ring-offset-2 ring-transparent" data-color="#934F9A"></button>
                    </div>
                </div>
                <p id="signupErrorText" class="text-[11px] text-red-500 hidden"></p>
                <button type="submit" class="w-full py-3 mt-1 rounded-xl bg-[#73B5FE] text-white font-bold text-sm hover:opacity-90 transition">회원가입 완료</button>
            </form>
        </div>
    </div>

    <!-- 내 프로필 관리 / 로그아웃 모달 -->
    <div id="userProfileModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-4 relative">
            <button type="button" onclick="closeProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <h2 class="text-lg font-bold">내 계정 정보 👤</h2>
            <div class="flex flex-col gap-2 text-xs border-y border-gray-200 dark:border-gray-800 py-3">
                <p><span class="font-semibold text-gray-500">이메일:</span> <span id="profileUserEmail">-</span></p>
                <p><span class="font-semibold text-gray-500">닉네임:</span> <span id="profileUserName">-</span></p>
            </div>

            <button type="button" onclick="handleLogout()" class="w-full py-2.5 rounded-xl bg-red-50 dark:bg-red-950/30 text-red-500 font-bold text-xs hover:bg-red-100 dark:hover:bg-red-900/50 transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
            </button>
        </div>
    </div>

    <!-- 헤더 영역 -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between gap-2">
        <button onclick="goHome()" class="flex items-center gap-2 text-lg font-extrabold tracking-tight">
            <i class="fa-solid fa-cloud text-xl text-[#73B5FE]"></i>
            <span>PixelHub</span>
        </button>

        <div class="flex items-center bg-gray-100 dark:bg-gray-800 p-1 rounded-full text-xs font-semibold">
            <button id="tabVideoBtn" onclick="switchTab('video')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white transition">
                <i class="fa-solid fa-film text-[#73B5FE]"></i><span>동영상</span>
            </button>
            <button id="tabCommunityBtn" onclick="switchTab('community')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">
                <i class="fa-solid fa-comments"></i><span>커뮤니티</span>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition" title="화면 테마 변경">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>

            <!-- 로그인 안 되었을 때 버튼 -->
            <button id="guestAuthBtn" onclick="openAuthModal()" class="px-3 py-1.5 rounded-full bg-[#73B5FE] text-white text-xs font-bold hover:opacity-90 transition">
                로그인 / 회원가입
            </button>

            <!-- 로그인 되었을 때 프로필 버튼 -->
            <button id="userAuthBtn" onclick="openProfileModal()" class="hidden flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-xs font-semibold hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <div id="userAvatarDot" class="w-3.5 h-3.5 rounded-full bg-[#73B5FE]"></div>
                <span id="headerUserName">유저</span>
            </button>

            <button onclick="switchTab('admin')" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 transition" title="관리자">
                <i class="fa-solid fa-user-shield"></i>
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-5">
        <section id="filterSection" class="flex flex-col gap-3">
            <div class="flex gap-2">
                <input type="text" id="searchInput" oninput="renderMainView()" placeholder="검색어를 입력하세요..." class="flex-1 bg-gray-100 dark:bg-gray-800 text-xs sm:text-sm border border-gray-200 dark:border-gray-700 rounded-xl py-2.5 px-3.5 focus:outline-none">
                <button onclick="openPostModal()" class="bg-[#73B5FE] text-white px-4 py-2.5 rounded-xl font-bold text-xs hover:opacity-90 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i> <span>글 작성하기</span>
                </button>
            </div>
        </section>

        <section id="videoSection" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5"></section>
        <section id="communitySection" class="hidden flex flex-col gap-4"></section>
        <section id="adminSection" class="hidden flex flex-col gap-4">
            <h2 class="font-bold text-lg border-b pb-2">⚙️ 관리자 대시보드</h2>
            <div id="adminPostList" class="flex flex-col gap-2"></div>
        </section>
    </main>

    <!-- 업로드 모달 -->
    <div id="postModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-4">
            <h2 class="text-base font-bold">게시물 작성</h2>
            <form onsubmit="handlePostSubmit(event)" class="flex flex-col gap-3 text-xs">
                <input type="text" id="postTitleInput" placeholder="제목" required class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2.5 rounded-lg">
                <textarea id="postContentInput" placeholder="설명 또는 글 내용을 입력하세요..." class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2.5 rounded-lg rows-3"></textarea>
                
                <div class="flex flex-col gap-1">
                    <label class="font-semibold text-gray-700 dark:text-gray-300">사진 또는 동영상 첨부 (또는 URL 링크)</label>
                    <input type="file" id="postFileInput" accept="image/*,video/*" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 rounded-lg text-xs">
                    <input type="url" id="postUrlInput" placeholder="또는 미디어 URL 링크 직접 입력" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-2 rounded-lg text-xs mt-1">
                </div>

                <div id="uploadProgressContainer" class="hidden flex flex-col gap-1">
                    <div class="flex justify-between text-[11px] text-gray-500 font-bold">
                        <span id="uploadStatusText">업로드 처리 중...</span>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-800 font-medium">취소</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 rounded-lg bg-[#73B5FE] text-white font-bold">게시하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9woOD28gKukh_aELmpLex3JvbBi0lreQ",
            authDomain: "pxll-dd7f7.firebaseapp.com",
            databaseURL: "https://pxll-dd7f7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pxll-dd7f7",
            storageBucket: "pxll-dd7f7.firebasestorage.app",
            messagingSenderId: "363694383096",
            appId: "1:363694383096:web:e3e7f9473e0f84ccfac00d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const BANNED_NICKNAMES = [
            "라더", "덕개", "각별", "공룡", "잠뜰", "수현",
            "sleepground", "rather", "duckgae", "rockggun", "hsrd", "heptagram", "ehdgh141", "dino", "suhyen"
        ];

        let currentUserData = null;
        let currentTab = 'video';
        let selectedColor = '#73B5FE';

        let globalVideos = [];
        let globalPosts = [];

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            listenAuthState();
            listenRealtimeData();
            selectColor('#73B5FE');
        });

        function initTheme() {
            const savedTheme = localStorage.getItem('pixel_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-yellow-400';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('pixel_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-yellow-400' : 'fa-solid fa-moon';
        }

        function listenAuthState() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const snap = await db.ref('users/' + user.uid).once('value');
                    let val = snap.val();

                    if (!val) {
                        const name = user.displayName || user.email.split('@')[0];
                        val = { name: name, color: '#73B5FE', email: user.email };
                        await db.ref('users/' + user.uid).set(val);
                    }

                    currentUserData = {
                        uid: user.uid,
                        email: user.email,
                        name: val.name,
                        color: val.color || '#73B5FE'
                    };
                    document.getElementById('guestAuthBtn').classList.add('hidden');
                    document.getElementById('userAuthBtn').classList.remove('hidden');
                    document.getElementById('headerUserName').innerText = currentUserData.name;
                    document.getElementById('userAvatarDot').style.backgroundColor = currentUserData.color;
                } else {
                    currentUserData = null;
                    document.getElementById('guestAuthBtn').classList.remove('hidden');
                    document.getElementById('userAuthBtn').classList.add('hidden');
                }
            });
        }

        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
            switchAuthTab('login');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabSignupBtn = document.getElementById('tabSignupBtn');

            document.getElementById('loginErrorText').classList.add('hidden');
            document.getElementById('signupErrorText').classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLoginBtn.className = "flex-1 py-2 font-bold text-sm text-[#73B5FE] border-b-2 border-[#73B5FE]";
                tabSignupBtn.className = "flex-1 py-2 font-bold text-sm text-gray-400 border-b-2 border-transparent";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignupBtn.className = "flex-1 py-2 font-bold text-sm text-[#73B5FE] border-b-2 border-[#73B5FE]";
                tabLoginBtn.className = "flex-1 py-2 font-bold text-sm text-gray-400 border-b-2 border-transparent";
            }
        }

        function selectColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color-opt').forEach(btn => {
                if (btn.dataset.color === color) {
                    btn.classList.add('ring-gray-400', 'dark:ring-white');
                } else {
                    btn.classList.remove('ring-gray-400', 'dark:ring-white');
                }
            });
        }

        async function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
                closeAuthModal();
            } catch (err) {
                alert('Google 로그인 오류: ' + err.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pw = document.getElementById('loginPassword').value;
            const errorText = document.getElementById('loginErrorText');
            errorText.classList.add('hidden');

            try {
                await auth.signInWithEmailAndPassword(email, pw);
                closeAuthModal();
            } catch (err) {
                errorText.innerText = "이메일 또는 비밀번호가 잘못되었습니다.";
                errorText.classList.remove('hidden');
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const pw = document.getElementById('signupPassword').value;
            const nickname = document.getElementById('signupNickname').value.trim();
            const errorText = document.getElementById('signupErrorText');
            errorText.classList.add('hidden');

            const lowerNick = nickname.toLowerCase();
            if (BANNED_NICKNAMES.some(banned => lowerNick.includes(banned))) {
                errorText.innerText = "사용할 수 없는 닉네임입니다.";
                errorText.classList.remove('hidden');
                return;
            }

            const usersSnap = await db.ref('users').once('value');
            const users = usersSnap.val();
            if (users) {
                const isDup = Object.values(users).some(u => u.name && u.name.toLowerCase() === lowerNick);
                if (isDup) {
                    errorText.innerText = "이미 사용 중인 닉네임입니다.";
                    errorText.classList.remove('hidden');
                    return;
                }
            }

            try {
                const res = await auth.createUserWithEmailAndPassword(email, pw);
                await db.ref('users/' + res.user.uid).set({
                    name: nickname,
                    color: selectedColor,
                    email: email
                });
                closeAuthModal();
            } catch (err) {
                if (err.code === 'auth/email-already-in-use') {
                    errorText.innerText = "이미 가입되어 있는 이메일입니다.";
                } else {
                    errorText.innerText = err.message;
                }
                errorText.classList.remove('hidden');
            }
        }

        function openProfileModal() {
            if (!currentUserData) return openAuthModal();
            document.getElementById('profileUserEmail').innerText = currentUserData.email;
            document.getElementById('profileUserName').innerText = currentUserData.name;
            document.getElementById('userProfileModal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('userProfileModal').classList.add('hidden');
        }

        function handleLogout() {
            auth.signOut().then(() => {
                closeProfileModal();
            });
        }

        function listenRealtimeData() {
            db.ref('posts').on('value', snapshot => {
                const data = snapshot.val();
                globalVideos = [];
                globalPosts = [];

                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = { id: key, ...data[key] };
                        if (item.type === 'video') globalVideos.push(item);
                        else globalPosts.push(item);
                    });
                }
                renderMainView();
            });
        }

        function switchTab(tab) {
            if (tab === 'admin') {
                const pw = prompt("관리자 비밀번호를 입력하세요:");
                if (pw !== "1234") return alert("비밀번호가 틀렸습니다.");
            }
            currentTab = tab;
            
            const vBtn = document.getElementById('tabVideoBtn');
            const cBtn = document.getElementById('tabCommunityBtn');
            
            if (tab === 'video') {
                vBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white transition";
                cBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition";
            } else if (tab === 'community') {
                cBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white transition";
                vBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition";
            }
            
            renderMainView();
        }

        function goHome() { switchTab('video'); }

        function renderMainView() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.getElementById('videoSection').classList.add('hidden');
            document.getElementById('communitySection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');

            if (currentTab === 'video') {
                document.getElementById('videoSection').classList.remove('hidden');
                const container = document.getElementById('videoSection');
                const filtered = globalVideos.filter(v => v.title.toLowerCase().includes(query) || (v.content && v.content.toLowerCase().includes(query)));
                
                container.innerHTML = filtered.length === 0 ? '<div class="col-span-full text-center text-xs text-gray-400 py-10">등록된 동영상이 없습니다.</div>' :
                    filtered.map(v => `
                        <div class="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 flex flex-col justify-between gap-3">
                            <div>
                                ${v.mediaUrl ? `<video src="${v.mediaUrl}" controls playsinline class="w-full h-48 object-cover rounded-lg mb-2 bg-black"></video>` : ''}
                                <h4 class="font-bold text-sm mb-1">${v.title}</h4>
                                <p class="text-xs text-gray-600 dark:text-gray-300 break-all">${v.content || ''}</p>
                            </div>
                            <div class="flex items-center gap-1.5 border-t border-gray-200 dark:border-gray-800 pt-2">
                                <div class="w-3 h-3 rounded-full" style="background-color: ${v.color || '#73B5FE'}"></div>
                                <span class="text-[11px] font-medium text-gray-500">${v.author}</span>
                            </div>
                        </div>
                    `).join('');
            } else if (currentTab === 'community') {
                document.getElementById('communitySection').classList.remove('hidden');
                const container = document.getElementById('communitySection');
                const filtered = globalPosts.filter(p => p.title.toLowerCase().includes(query) || (p.content && p.content.toLowerCase().includes(query)));

                container.innerHTML = filtered.length === 0 ? '<div class="text-center text-xs text-gray-400 py-10">작성된 게시글이 없습니다.</div>' :
                    filtered.map(p => `
                        <div class="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 flex flex-col justify-between gap-3">
                            <div>
                                <h4 class="font-bold text-sm mb-1">${p.title}</h4>
                                <p class="text-xs text-gray-600 dark:text-gray-300 mb-2 break-all">${p.content || ''}</p>
                                ${p.mediaUrl ? (p.mediaType === 'video' ? 
                                    `<video src="${p.mediaUrl}" controls playsinline class="w-full max-h-80 rounded-lg bg-black"></video>` : 
                                    `<img src="${p.mediaUrl}" class="w-full max-h-80 object-cover rounded-lg">`) : ''}
                            </div>
                            <div class="flex items-center gap-1.5 border-t border-gray-200 dark:border-gray-800 pt-2">
                                <div class="w-3 h-3 rounded-full" style="background-color: ${p.color || '#73B5FE'}"></div>
                                <span class="text-[11px] font-medium text-gray-500">${p.author}</span>
                            </div>
                        </div>
                    `).join('');
            } else if (currentTab === 'admin') {
                document.getElementById('adminSection').classList.remove('hidden');
                const container = document.getElementById('adminPostList');
                const all = [...globalVideos, ...globalPosts];
                container.innerHTML = all.length === 0 ? '<div class="text-xs text-gray-400 py-4">게시물이 없습니다.</div>' :
                    all.map(item => `
                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-800/50 rounded-lg text-xs border border-gray-200 dark:border-gray-700">
                            <span class="truncate max-w-[80%]">[${item.type}] <strong>${item.title}</strong> (${item.author})</span>
                            <button onclick="deleteItem('${item.id}')" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">삭제</button>
                        </div>
                    `).join('');
            }
        }

        function openPostModal() { 
            if (!currentUserData) return openAuthModal();
            document.getElementById('postModal').classList.remove('hidden'); 
        }

        function closePostModal() { 
            document.getElementById('postModal').classList.add('hidden'); 
            document.getElementById('uploadProgressContainer').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;
        }

        async function handlePostSubmit(e) {
            e.preventDefault();
            if (!currentUserData) return openAuthModal();

            const title = document.getElementById('postTitleInput').value;
            const content = document.getElementById('postContentInput').value;
            const fileInput = document.getElementById('postFileInput');
            const urlInput = document.getElementById('postUrlInput').value.trim();
            const file = fileInput.files[0];

            const progressContainer = document.getElementById('uploadProgressContainer');
            const statusText = document.getElementById('uploadStatusText');
            const submitBtn = document.getElementById('submitBtn');

            let mediaUrl = urlInput;
            let mediaType = '';

            if (file) {
                progressContainer.classList.remove('hidden');
                submitBtn.disabled = true;
                statusText.innerText = "파일 업로드 처리 중...";

                try {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        mediaUrl = event.target.result;
                        const isVideo = file.type.startsWith('video') || file.name.match(/\.(mp4|mov|avi|wmv|mkv)$/i);
                        mediaType = isVideo ? 'video' : 'image';
                        const postType = currentTab === 'video' || isVideo ? 'video' : 'community';

                        saveToDatabase(postType, title, content, mediaUrl, mediaType);
                    };
                    reader.readAsDataURL(file);
                } catch(err) {
                    alert('업로드 실패: ' + err.message);
                    submitBtn.disabled = false;
                    progressContainer.classList.add('hidden');
                }
            } else {
                if (mediaUrl) {
                    const isVideo = mediaUrl.match(/\.(mp4|mov|avi|wmv|mkv)$/i) || currentTab === 'video';
                    mediaType = isVideo ? 'video' : 'image';
                }
                saveToDatabase(currentTab === 'video' ? 'video' : 'community', title, content, mediaUrl, mediaType);
            }
        }

        function saveToDatabase(type, title, content, mediaUrl, mediaType) {
            db.ref('posts').push({
                type: type,
                title: title,
                content: content,
                mediaUrl: mediaUrl,
                mediaType: mediaType,
                author: currentUserData.name,
                color: currentUserData.color,
                uid: currentUserData.uid,
                createdAt: Date.now()
            }).then(() => {
                closePostModal();
                document.getElementById('postTitleInput').value = '';
                document.getElementById('postContentInput').value = '';
                document.getElementById('postFileInput').value = '';
                document.getElementById('postUrlInput').value = '';
            }).catch(err => {
                alert('데이터 저장 실패: ' + err.message);
            });
        }

        function deleteItem(id) {
            if (confirm("정말 이 항목을 삭제하시겠습니까?")) {
                db.ref('posts/' + id).remove();
            }
        }
    </script>
</body>
</html>
