<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#73B5FE' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #00000022; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #ffffff22; }
        .text-ellipse-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- 프로필 설정 모달 -->
    <div id="userProfileModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-5">
            <div class="text-center">
                <h2 id="profileModalTitle" class="text-xl font-bold mb-1">프로필 설정 👋</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400">사용할 닉네임과 포인트 색상을 설정하세요.</p>
            </div>
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">닉네임</label>
                    <input type="text" id="initNicknameInput" placeholder="닉네임을 입력하세요" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#73B5FE]">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-2">프로필 색상</label>
                    <div class="flex justify-between items-center px-2">
                        <button type="button" onclick="selectColor('#E8472A')" class="color-opt w-8 h-8 rounded-full bg-[#E8472A] ring-2 ring-offset-2 ring-transparent" data-color="#E8472A"></button>
                        <button type="button" onclick="selectColor('#FFB400')" class="color-opt w-8 h-8 rounded-full bg-[#FFB400] ring-2 ring-offset-2 ring-transparent" data-color="#FFB400"></button>
                        <button type="button" onclick="selectColor('#FCDB00')" class="color-opt w-8 h-8 rounded-full bg-[#FCDB00] ring-2 ring-offset-2 ring-transparent" data-color="#FCDB00"></button>
                        <button type="button" onclick="selectColor('#829D56')" class="color-opt w-8 h-8 rounded-full bg-[#829D56] ring-2 ring-offset-2 ring-transparent" data-color="#829D56"></button>
                        <button type="button" onclick="selectColor('#73B5FE')" class="color-opt w-8 h-8 rounded-full bg-[#73B5FE] ring-2 ring-offset-2 ring-transparent" data-color="#73B5FE"></button>
                        <button type="button" onclick="selectColor('#934F9A')" class="color-opt w-8 h-8 rounded-full bg-[#934F9A] ring-2 ring-offset-2 ring-transparent" data-color="#934F9A"></button>
                    </div>
                </div>
            </div>
            <button id="saveProfileBtn" class="w-full py-3 rounded-xl bg-[#73B5FE] text-white font-bold text-sm hover:opacity-90 transition">저장하기</button>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-2.5 flex items-center justify-between gap-2">
        <button onclick="goHome()" class="flex items-center gap-2 text-lg font-extrabold tracking-tight">
            <i class="fa-solid fa-cloud text-2xl text-[#73B5FE]"></i>
            <span class="hidden sm:inline">PixelHub</span>
        </button>
        <div class="flex items-center bg-gray-100 dark:bg-gray-800 p-1 rounded-full text-xs font-semibold">
            <button id="tabVideoBtn" onclick="switchTab('video')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white transition">
                <i class="fa-solid fa-film text-[#73B5FE]"></i><span>동영상</span>
            </button>
            <button id="tabCommunityBtn" onclick="switchTab('community')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">
                <i class="fa-solid fa-comments"></i><span>커뮤니티</span>
            </button>
        </div>
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-xs font-medium">
                <div id="userAvatarDot" class="w-4 h-4 rounded-full bg-[#73B5FE]"></div>
                <span id="headerUserName">익명</span>
            </div>
            <button onclick="switchTab('admin')" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 transition" title="관리자">
                <i class="fa-solid fa-user-shield"></i>
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-5">
        <section id="filterSection" class="flex flex-col gap-3">
            <div class="flex gap-2">
                <input type="text" id="searchInput" oninput="renderMainView()" placeholder="검색어 입력..." class="flex-1 bg-gray-100 dark:bg-gray-800 text-xs sm:text-sm border border-gray-200 dark:border-gray-700 rounded-xl py-2.5 px-4 focus:outline-none">
                <button onclick="openPostModal()" class="bg-[#73B5FE] text-white px-4 py-2.5 rounded-xl font-bold text-xs hover:opacity-90">
                    <i class="fa-solid fa-plus"></i> <span id="uploadBtnText">글 등록하기</span>
                </button>
            </div>
        </section>

        <!-- 동영상 목록 -->
        <section id="videoSection" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></section>

        <!-- 커뮤니티 목록 -->
        <section id="communitySection" class="hidden flex flex-col gap-4"></section>

        <!-- 관리자 섹션 -->
        <section id="adminSection" class="hidden flex flex-col gap-4">
            <h2 class="font-bold text-lg border-b pb-2">⚙️ 관리자 대시보드 (전체 삭제 권한)</h2>
            <div id="adminPostList" class="flex flex-col gap-2"></div>
        </section>
    </main>

    <!-- 업로드 모달 -->
    <div id="postModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-4">
            <h2 id="postModalTitle" class="text-base font-bold">게시물 업로드</h2>
            <form onsubmit="handlePostSubmit(event)" class="flex flex-col gap-3 text-xs">
                <input type="text" id="postTitleInput" placeholder="제목" required class="bg-gray-50 dark:bg-gray-800 border p-2.5 rounded-lg">
                <textarea id="postContentInput" placeholder="내용 또는 비디오 URL" required class="bg-gray-50 dark:bg-gray-800 border p-2.5 rounded-lg rows-3"></textarea>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-800">취소</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-[#73B5FE] text-white font-bold">게시하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🎯 이미지에서 추출한 진짜 Firebase 설정값 적용 완료!
        const firebaseConfig = {
            apiKey: "AIzaSyC9woOD28gKukh_aELmpLex3JvbBi0lreQ",
            authDomain: "pxll-dd7f7.firebaseapp.com",
            databaseURL: "https://pxll-dd7f7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pxll-dd7f7",
            storageBucket: "pxll-dd7f7.firebasestorage.app",
            messagingSenderId: "363694383096",
            appId: "1:363694383096:web:e3e7f9473e0f84ccfac00d",
            measurementId: "G-3320NS0MXS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('pixel_user')) || null;
        let currentTab = 'video';
        let selectedColor = '#73B5FE';

        let globalVideos = [];
        let globalPosts = [];

        document.addEventListener('DOMContentLoaded', () => {
            initUserProfile();
            listenRealtimeData();
        });

        function initUserProfile() {
            if (!currentUser) {
                document.getElementById('userProfileModal').classList.remove('hidden');
            } else {
                updateProfileUI();
            }
        }

        function selectColor(color) { 
            selectedColor = color;
            document.querySelectorAll('.color-opt').forEach(btn => {
                if(btn.dataset.color === color) {
                    btn.classList.add('ring-gray-400', 'dark:ring-white');
                } else {
                    btn.classList.remove('ring-gray-400', 'dark:ring-white');
                }
            });
        }

        document.getElementById('saveProfileBtn').addEventListener('click', () => {
            const nick = document.getElementById('initNicknameInput').value.trim() || '익명' + Math.floor(Math.random()*1000);
            currentUser = { name: nick, color: selectedColor };
            localStorage.setItem('pixel_user', JSON.stringify(currentUser));
            document.getElementById('userProfileModal').classList.add('hidden');
            updateProfileUI();
        });

        function updateProfileUI() {
            if (!currentUser) return;
            document.getElementById('headerUserName').innerText = currentUser.name;
            document.getElementById('userAvatarDot').style.backgroundColor = currentUser.color;
        }

        function listenRealtimeData() {
            db.ref('posts').on('value', snapshot => {
                const data = snapshot.val();
                globalVideos = [];
                globalPosts = [];

                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = { id: key, ...data[key] };
                        if (item.type === 'video') globalVideos.push(item);
                        else globalPosts.push(item);
                    });
                }
                renderMainView();
            });
        }

        function switchTab(tab) {
            if (tab === 'admin') {
                const pw = prompt("관리자 비밀번호를 입력하세요:");
                if (pw !== "1234") return alert("비밀번호가 틀렸습니다.");
            }
            currentTab = tab;
            
            const vBtn = document.getElementById('tabVideoBtn');
            const cBtn = document.getElementById('tabCommunityBtn');
            
            if (tab === 'video') {
                vBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white transition";
                cBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition";
            } else if (tab === 'community') {
                cBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white transition";
                vBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition";
            }
            
            renderMainView();
        }

        function goHome() { switchTab('video'); }

        function renderMainView() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.getElementById('videoSection').classList.add('hidden');
            document.getElementById('communitySection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');

            if (currentTab === 'video') {
                document.getElementById('videoSection').classList.remove('hidden');
                const container = document.getElementById('videoSection');
                const filtered = globalVideos.filter(v => v.title.toLowerCase().includes(query) || v.content.toLowerCase().includes(query));
                
                container.innerHTML = filtered.length === 0 ? '<div class="col-span-full text-center text-xs text-gray-400 py-10">등록된 동영상이 없습니다.</div>' :
                    filtered.map(v => `
                        <div class="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-sm mb-1">${v.title}</h4>
                                <p class="text-xs text-gray-600 dark:text-gray-300 mb-3 break-all">${v.content}</p>
                            </div>
                            <div class="flex items-center gap-1.5 mt-2">
                                <div class="w-3 h-3 rounded-full" style="background-color: ${v.color || '#73B5FE'}"></div>
                                <span class="text-[11px] font-medium text-gray-500">${v.author}</span>
                            </div>
                        </div>
                    `).join('');
            } else if (currentTab === 'community') {
                document.getElementById('communitySection').classList.remove('hidden');
                const container = document.getElementById('communitySection');
                const filtered = globalPosts.filter(p => p.title.toLowerCase().includes(query) || p.content.toLowerCase().includes(query));

                container.innerHTML = filtered.length === 0 ? '<div class="text-center text-xs text-gray-400 py-10">작성된 게시글이 없습니다.</div>' :
                    filtered.map(p => `
                        <div class="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-sm mb-1">${p.title}</h4>
                                <p class="text-xs text-gray-600 dark:text-gray-300 mb-3 break-all">${p.content}</p>
                            </div>
                            <div class="flex items-center gap-1.5 mt-2">
                                <div class="w-3 h-3 rounded-full" style="background-color: ${p.color || '#73B5FE'}"></div>
                                <span class="text-[11px] font-medium text-gray-500">${p.author}</span>
                            </div>
                        </div>
                    `).join('');
            } else if (currentTab === 'admin') {
                document.getElementById('adminSection').classList.remove('hidden');
                const container = document.getElementById('adminPostList');
                const all = [...globalVideos, ...globalPosts];
                container.innerHTML = all.length === 0 ? '<div class="text-xs text-gray-400 py-4">게시물이 없습니다.</div>' :
                    all.map(item => `
                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-800/50 rounded-lg text-xs border border-gray-200 dark:border-gray-700">
                            <span class="truncate max-w-[80%]">[${item.type}] <strong>${item.title}</strong> (${item.author})</span>
                            <button onclick="deleteItem('${item.id}')" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">삭제</button>
                        </div>
                    `).join('');
            }
        }

        function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
        function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }

        function handlePostSubmit(e) {
            e.preventDefault();
            if (!currentUser) return alert("프로필 설정을 진행해주세요.");

            const title = document.getElementById('postTitleInput').value;
            const content = document.getElementById('postContentInput').value;

            db.ref('posts').push({
                type: currentTab === 'admin' ? 'community' : currentTab,
                title: title,
                content: content,
                author: currentUser.name,
                color: currentUser.color,
                createdAt: Date.now()
            });

            closePostModal();
            document.getElementById('postTitleInput').value = '';
            document.getElementById('postContentInput').value = '';
        }

        function deleteItem(id) {
            if (confirm("정말 이 항목을 삭제하시겠습니까?")) {
                db.ref('posts/' + id).remove();
            }
        }
    </script>
</body>
</html>
